name: Release

# release-please keeps a release PR open; merging it bumps the version, writes
# CHANGELOG.md and tags vX.Y.Z. That tag is the entire point — consumers pin it
# as a git dependency.
#
# There is deliberately NO publish step. This package never goes to npm, so it
# carries none of @originsuite/glyph's OIDC, Trusted Publisher or provenance
# plumbing. Do not copy that workflow's second half in here.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
