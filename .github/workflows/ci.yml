name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # dist is committed, because a git dependency does not build on install.
      # A stale dist means consumers get yesterday's tokens from a tag that
      # claims today's, so the PR cannot merge until it is regenerated.
      - name: dist is up to date
        run: git diff --exit-code dist

      - name: Test
        run: pnpm test
