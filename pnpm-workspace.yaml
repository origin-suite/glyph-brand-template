# Single-package repo. This file exists only to hold pnpm settings, which
# pnpm 11 reads from here rather than from package.json's "pnpm" field.
#
# vitest transforms TypeScript with esbuild, whose postinstall links the
# platform binary. pnpm blocks install scripts by default, so it is approved
# here rather than by a local `pnpm approve-builds` — CI needs it too.
allowBuilds:
  esbuild: true
